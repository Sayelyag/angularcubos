<main class="container mt-5 mb-5">
  <h1 class="text-center mb-4" style="color: #005187;">Marcas de cubos {{ marcaSeleccionada }}</h1>

  <p *ngIf="error" class="alert alert-danger">{{ error }}</p>

  <section *ngIf="marcaSeleccionada" class="mt-5">
    <h2 class="mb-4" style="color: #005187;">
      Cubos de {{ marcaSeleccionada }}
    </h2>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4" *ngFor="let cubo of cubos">
        <article class="card h-100">
          <img class="card-img-top p-3" [src]="cubo.imagen" [alt]="cubo.nombre">
          <div class="card-body">
            <h3 class="h5">{{ cubo.nombre }}</h3>
            <p class="mb-0">{{ cubo.precio }} €</p>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>
