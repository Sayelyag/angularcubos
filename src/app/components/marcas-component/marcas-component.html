<div class="min-h-screen bg-slate-100 p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-extrabold text-center text-slate-900 mb-4">
            {{ marcaSeleccionada ? 'Cubos de ' + marcaSeleccionada : 'Cubos de Rubik' }}
        </h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            @for (cubo of cubos; track cubo) {
                <div class="bg-slate-900 rounded-2xl shadow-lg overflow-hidden border border-slate-700 hover:shadow-2xl hover:-translate-y-2 transition duration-300">
                    <h1 class="text-2xl font-extrabold text-center text-white p-5 border-b-2 border-cyan-500">
                        {{cubo.nombre}}
                    </h1>
                    <img
                        class="w-full h-80 object-cover hover:scale-105 transition duration-500"
                        src="{{cubo.imagen}}"
                        alt="">
                </div>
            }
        </div>
    </div>
</div>
