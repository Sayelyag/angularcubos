<!-- Barra de navegación de Bootstrap -->
<nav class="navbar navbar-expand-lg bg-body-tertiary" style="
    background-color: #84b6f4 !important;
    padding: 12px 25px;
    box-shadow: 0 4px 14px rgba(0, 81, 135, 0.2);
    border-bottom: 3px solid #84b6f4;
">

    <div class="container-fluid">

        <!-- Logo -->
        <!-- <a class="navbar-brand" href="#" style="
            border-radius: 8px;
            transition: transform 0.2s ease;
        "
        onmouseover="this.style.transform='scale(1.05)'"
        onmouseout="this.style.transform='scale(1)'">
            <img
                src="/assets/ace.jpg"
                style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;"
                alt="Logo"
            />
        </a> -->

        <!-- Login -->
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/login']" style="
            color: #feffff;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 7px;
            transition: color 0.2s ease, background-color 0.2s ease;
            "
            onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
            onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'">
                Login
          </a>
        </li>

        <!-- Botón para móviles -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
            style="
                border: 1px solid #84b6f4;
                background-color: #4d82be;
            "
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido del menú -->
        <div
            class="collapse navbar-collapse"
            id="navbarSupportedContent"
        >

            <!-- Lista de enlaces -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Inicio -->
                <li class="nav-item">
                    <a class="nav-link" href="/" style="
                        color: #feffff;
                        font-weight: 600;
                        padding: 10px 16px;
                        border-radius: 7px;
                        transition: color 0.2s ease, background-color 0.2s ease;
                    "
                    onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
                    onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'">
                        home
                    </a>
                </li>

                <!-- Login -->
                <!-- <li class="nav-item">
                    <a class="nav-link" href="/login" style="
                        color: #feffff;
                        font-weight: 600;
                        padding: 10px 16px;
                        border-radius: 7px;
                        transition: color 0.2s ease, background-color 0.2s ease;
                    "
                    onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
                    onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'">
                        acceder
                    </a>
                </li> -->

                <!-- Subordinados -->
                <li class="nav-item">
                    <a class="nav-link" href="/cubos" style="
                        color: #feffff;
                        font-weight: 600;
                        padding: 10px 16px;
                        border-radius: 7px;
                        transition: color 0.2s ease, background-color 0.2s ease;
                    "
                    onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
                    onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'">
                        Cubos
                    </a>
                </li>

                <!-- PDF -->
                <li class="nav-item">
                    <a class="nav-link" href="/pdf" style="
                        color: #feffff;
                        font-weight: 600;
                        padding: 10px 16px;
                        border-radius: 7px;
                        transition: color 0.2s ease, background-color 0.2s ease;
                    "
                    onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
                    onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'">
                        pdf
                    </a>
                </li>

                <!-- Menú desplegable -->
                <li class="nav-item dropdown">

                    <button
                        type="button"
                        class="nav-link dropdown-toggle"
                        role="button"
                        (click)="alternarMarcas()"
                        [attr.aria-expanded]="marcasAbiertas"
                        style="
                            color: #feffff;
                            font-weight: 600;
                            padding: 10px 16px;
                            border-radius: 7px;
                            transition: color 0.2s ease, background-color 0.2s ease;
                        "
                        onmouseover="this.style.color='#005187'; this.style.backgroundColor='#c4dafa'"
                        onmouseout="this.style.color='#feffff'; this.style.backgroundColor='transparent'"
                    >
                        Marcas
                        </button>

                    <!-- Opciones desplegables -->
                        <ul class="dropdown-menu"
                        [class.show]="marcasAbiertas"
                        [style.display]="marcasAbiertas ? 'block' : 'none'"
                        style="
                        background-color: #feffff;
                        border: 1px solid #84b6f4;
                        border-radius: 10px;
                        box-shadow: 0 5px 15px rgba(0, 81, 135, 0.15);
                        padding: 8px;
                    ">

                        <li *ngFor="let marca of marcas">
                            <a class="dropdown-item" href="/marcas" (click)="seleccionarMarca($event, marca)" style="
                                color: #005187;
                                border-radius: 6px;
                                padding: 9px 12px;
                                transition: background-color 0.2s ease;
                            "
                            onmouseover="this.style.backgroundColor='#c4dafa'"
                            onmouseout="this.style.backgroundColor='transparent'">
                                {{ marca }}
                            </a>
                        </li>

                    </ul>
                </li>

                <!-- Elemento desactivado -->
                <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true" style="
                        color: #84b6f4;
                        font-weight: 500;
                        padding: 10px 16px;
                        opacity: 0.65;
                    ">
                        Disabled
                    </a>
                </li>

            </ul>

            <!-- Botón para cerrar sesión -->
            <button
                (click)="logout()"
                class="btn btn-outline-danger"
                type="button"
                style="
                    background-color: #4d82be;
                    color: #feffff;
                    border: 1px solid #84b6f4;
                    border-radius: 7px;
                    padding: 8px 18px;
                    font-weight: 600;
                    transition: background-color 0.2s ease, color 0.2s ease;
                "
                onmouseover="this.style.backgroundColor='#c4dafa'; this.style.color='#005187'"
                onmouseout="this.style.backgroundColor='#4d82be'; this.style.color='#feffff'"
            >
                logout
            </button>
        </div>
    </div>
</nav>
