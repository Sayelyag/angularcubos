
<!-- Contenedor principal -->
<div class="container mt-5 mb-5">

    <!-- Título -->
    <div class="text-center mb-5">
        <h1
            class="fw-bold mb-2"
            style="
                color: #005187;
                font-size: 2.5rem;
                letter-spacing: 1px;
            "
        >
             Cubos de Rubik
        </h1>
        <p style="color: #4d82be; font-size: 1.1rem;">
            Descubre nuestra colección de cubos
        </p>

        <div
            class="mx-auto rounded-pill"
            style="
                width: 80px;
                height: 4px;
                background-color: #84b6f4;
            "
        ></div>
    </div>

    <p *ngIf="error" class="alert alert-danger">{{ error }}</p>

    <section class="mt-5">

        <h2
            class="text-center fw-bold mb-4"
            style="color: #005187;"
        >
            Selecciona tu cubo favorito
        </h2>

        <div class="cubos-grid">
            <app-cubo-component
                *ngFor="let cubo of cubos"
                [cubo]="cubo"
                (favoritoSeleccionado)="seleccionarFavorito($event)">
            </app-cubo-component>
        </div>

        <!-- Cubo favorito -->
        <section
            *ngIf="cuboFavorito"
            class="favorito mt-4 p-4 rounded-4 text-center"
            style="
                background-color: #eaf3ff;
                border: 2px solid #84b6f4;
                box-shadow: 0 4px 12px rgba(0, 81, 135, 0.10);
            "
        >
            <h2 class="fw-bold mb-3" style="color: #005187;">
                Cubo favorito seleccionado:
            </h2>

            <img [src]="cuboFavorito.imagen" [alt]="cuboFavorito.nombre"s
            style="max-width: 150px; border-radius: 8px; margin-bottom: 15px;">

            <p class="mb-0 fs-5" style="color: #4d82be;">
                {{ cuboFavorito.nombre }} - {{ cuboFavorito.marca }}
            </p>
        </section>

    </section>

</div>
